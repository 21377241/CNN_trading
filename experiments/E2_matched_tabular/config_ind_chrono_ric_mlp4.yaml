# Versioned 180D chronological Rank-IC MLP-4 run for E2B--E5 replacement.
window_size: 20
ma_lag: 20
seed: 42
train_val_split: 0.7
ann_factor: 52
include_indicators: true
split_mode: chrono
chrono_train_years: [2000, 2001, 2002, 2003, 2004, 2005]
chrono_val_years: [2006, 2007]
is_years: [2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007]
oos_years: [2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
paths:
  feather: WORK_SPACE/data/ashare_processed_data/ashare_ret.feather
  labels_glob: WORK_SPACE/data/ashare_stocks_dataset/I20R5/stocks_CHN/dataset_all/20d_week_has_vb_[20]_ma_{year}_labels.feather
  ensem_root: WORK_SPACE/ashare_model_res_I20R5
  features_root: WORK_SPACE/paper/E2_matched_is_ind
  out_root: WORK_SPACE/paper/E2_matched_is_ind_chrono_ric_mlp4
  results_md: null
histgb:
  random_state: 42
  search_metric: val_rank_ic
  paper: {learning_rate: 0.05, max_iter: 300, max_leaf_nodes: 31, min_samples_leaf: 100, l2_regularization: 0.0, validation_fraction: 0.1, n_iter_no_change: 20}
  grid: {learning_rate: [0.03, 0.05, 0.08], max_leaf_nodes: [15, 31, 63], min_samples_leaf: [50, 100, 200], l2_regularization: [0.0, 1.0]}
logit:
  random_state: 47
  clip_low: -8
  clip_high: 8
  search_metric: val_rank_ic
  paper: {alpha: 1.0e-4, eta0: 0.01, max_iter: 3}
  grid: {alpha: [1.0e-5, 1.0e-4, 1.0e-3, 1.0e-2], eta0: [0.001, 0.01, 0.05], max_iter: [3, 10]}
mlp:
  hidden_layer_sizes: [128, 64, 32, 16]
  alpha: 0.0001
  learning_rate_init: 0.001
  max_iter: 200
  early_stopping: true
  validation_fraction: 0.15
  n_iter_no_change: 15
  bagging: true
  n_seeds: 10
  es_mode: chrono
  monitor: rank_ic
