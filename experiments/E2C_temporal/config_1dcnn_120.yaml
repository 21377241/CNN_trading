# E2C — Temporal Numerical Benchmark (1D-CNN-120)
window_size: 20
per_day_features: 6
seed: 42
seeds: [42, 43, 44, 45, 46]
ann_factor: 52
split_mode: chrono
chrono_train_years: [2000, 2001, 2002, 2003, 2004, 2005]
chrono_val_years: [2006, 2007]

paths:
  features_root: WORK_SPACE/paper/E2_matched_is/features
  cnn_pred: WORK_SPACE/paper/E2_matched_is_ind_chrono_ric/preds/pred_cnn_oos.csv
  out_root: WORK_SPACE/paper/E2C_temporal_1dcnn_120

model:
  hidden_channels: [32, 64]
  kernel_size: 3
  dropout: 0.25

train:
  batch_size: 4096
  max_epochs: 80
  patience: 10
  learning_rate: 0.001
  weight_decay: 0.0001
  num_workers: 0
  monitor: rank_ic
  device: auto

