# E2G ChartCNN-M：对标 R2008 选定 MLP 参数量（28929）→ k=10, 10-20-40 (29762)
spec: I20R5_clean
window_size: 20
predict_window: 5
freq: week
country: CHN

search_metric: val_rank_ic
training: clean
monitor: rank_ic
run_portfolio_analysis: false

channels: [10, 20, 40]
e2g:
  name: chartcnn_m
  target_model: mlp_140_R2008
  target_parameters: 28929
  width_multiplier: 10
  expected_parameters: 29762

train_years: [2000, 2001, 2002, 2003, 2004, 2005]
val_years: [2006, 2007]
oos_years: [2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]

dataset_subdir: I20R5_clean
out_root: WORK_SPACE/paper/E2G_clean/R2008/chartcnn_m

batch_size: 128
max_epochs: 50
n_ensembles_full: 5

anchor:
  lr: 1.0e-5
  dropout: 0.50
  patience: 2

grid:
  lr: [3.0e-6, 1.0e-5, 3.0e-5, 1.0e-4]
  dropout: [0.40, 0.50, 0.60]
  patience: [2, 5]

phases:
  phase1:
    mode: factorial
    n_ensembles: 1
  phase2:
    n_ensembles: 5
    top_k: 3
    use_grid_patience: true
  phase3:
    n_ensembles: 5
    top_k: 2
    val_metric_gap_for_top2: 0.002
    always_full_train_anchor_if_not_in_top: true
