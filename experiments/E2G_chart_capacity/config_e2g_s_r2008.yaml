# E2G ChartCNN-S：对标 R2008 选定 1D-CNN 参数量（125825）→ k=24, 24-48-96 (121826)
# 干净图像 + 对称 factorial；切分 = S0 / R2008；OOS 2008–2026（容量对照，不改主分析选定）
spec: I20R5_clean
window_size: 20
predict_window: 5
freq: week
country: CHN

search_metric: val_rank_ic
training: clean
monitor: rank_ic
run_portfolio_analysis: false

channels: [24, 48, 96]
e2g:
  name: chartcnn_s
  target_model: onedcnn_140_R2008
  target_parameters: 125825
  width_multiplier: 24
  expected_parameters: 121826

train_years: [2000, 2001, 2002, 2003, 2004, 2005]
val_years: [2006, 2007]
oos_years: [2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]

dataset_subdir: I20R5_clean
out_root: WORK_SPACE/paper/E2G_clean/R2008/chartcnn_s

batch_size: 128
max_epochs: 50
n_ensembles_full: 5

anchor:
  lr: 1.0e-5
  dropout: 0.50
  patience: 2

grid:
  lr: [3.0e-6, 1.0e-5, 3.0e-5, 1.0e-4]
  dropout: [0.40, 0.50, 0.60]
  patience: [2, 5]

phases:
  phase1:
    mode: factorial
    n_ensembles: 1
  phase2:
    n_ensembles: 5
    top_k: 3
    use_grid_patience: true
  phase3:
    n_ensembles: 5
    top_k: 2
    val_metric_gap_for_top2: 0.002
    always_full_train_anchor_if_not_in_top: true
